<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Website Under Maintenance</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: #111214;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    .maintenance-box {
      max-width: 600px;
    }

    h1 {
      margin-bottom: 16px;
      font-size: clamp(2rem, 6vw, 4rem);
    }

    p {
      margin: 0;
      color: #c8c8c8;
      font-size: 1.1rem;
      line-height: 1.6;
    }
  </style>
</head>

<body>
  <main class="maintenance-box">
    <h1>We’ll Be Back Soon</h1>

    <p>
      Sorry, our website is currently undergoing scheduled maintenance.
      Please check back shortly.
    </p>
  </main>
</body>
</html>
